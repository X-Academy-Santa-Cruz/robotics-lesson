<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <defs><marker id="ah-0E7C7B" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="#0E7C7B"/></marker></defs><text x="40" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">Bilge-pump thruster</text><text x="40" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6B75" text-anchor="start">A marine bilge pump motor fitted with a propeller — the ROV's thruster.</text><path d="M286 135 q-10 -34 -34 -50" stroke="#C0392B" stroke-width="6" fill="none"/><path d="M314 135 q10 -34 34 -50" stroke="#111" stroke-width="6" fill="none"/><text x="356" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B75" text-anchor="start">power leads (2)</text><rect x="245" y="135" width="110" height="150" rx="14" fill="#1F3A5F" stroke="#0E7C7B" stroke-width="3"/><ellipse cx="300" cy="135" rx="55" ry="16" fill="#2E8BA0"/><text x="300" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">motor</text><text x="300" y="225" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#CFE8EF" text-anchor="middle">(bilge pump)</text><rect x="295" y="285" width="10" height="28" fill="#5A6B75"/><ellipse cx="300" cy="317" rx="70" ry="20" fill="none" stroke="#5A6B75" stroke-width="1.5" stroke-dasharray="4 4"/><g transform="translate(300,317)">
