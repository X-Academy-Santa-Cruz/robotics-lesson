     <path d="M0 0 Q-50 26 -78 6 Q-44 -6 0 0 Z" fill="#5fd0c5" stroke="#2bb3a3" stroke-width="2"/>
     <circle cx="0" cy="0" r="9" fill="#0E7C7B"/></g><text x="300" y="363" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#12222E" text-anchor="middle">propeller</text><line x1="420" y1="235" x2="420" y2="365" stroke="#0E7C7B" stroke-width="4" marker-end="url(#ah-0E7C7B)"/><text x="430" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0E7C7B" text-anchor="start">water pushed</text><text x="430" y="321" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0E7C7B" text-anchor="start">this way</text><rect x="540" y="90" width="190" height="250" rx="12" fill="#CFE8EF"/><text x="556" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F3A5F" text-anchor="start">Key points</text><text x="556" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#12222E" text-anchor="start">Cheap, waterproof</text><text x="556" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#12222E" text-anchor="start">Two wires = power</text><text x="556" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#12222E" text-anchor="start">Spins one way per</text><text x="556" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#12222E" text-anchor="start">wire polarity</text><text x="556" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#12222E" text-anchor="start">Propeller sets</text><text x="556" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#12222E" text-anchor="start">thrust direction</text>
