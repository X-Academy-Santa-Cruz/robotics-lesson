  <defs><marker id="ah-0E7C7B" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="#0E7C7B"/></marker><marker id="ah-2E8BA0" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="#2E8BA0"/></marker></defs><text x="40" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">goBILDA motor controller</text><text x="40" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6B75" text-anchor="start">Reads a small servo-style PWM signal and switches the big battery current to a thruster.</text><rect x="90" y="110" width="380" height="250" rx="12" fill="#14321f" stroke="#0c2114" stroke-width="3"/><circle cx="106" cy="126" r="7" fill="#0a1a10" stroke="#2a4a30" stroke-width="2"/><circle cx="454" cy="126" r="7" fill="#0a1a10" stroke="#2a4a30" stroke-width="2"/><circle cx="106" cy="344" r="7" fill="#0a1a10" stroke="#2a4a30" stroke-width="2"/><circle cx="454" cy="344" r="7" fill="#0a1a10" stroke="#2a4a30" stroke-width="2"/><text x="280" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#cfe8d8" text-anchor="middle">goBILDA</text><text x="280" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9fc2a9" text-anchor="middle">speed controller</text><rect x="114" y="200" width="60" height="34" rx="5" fill="#C0392B"/><rect x="114" y="244" width="60" height="34" rx="5" fill="#111"/><text x="144" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">+</text><text x="144" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">−</text><text x="144" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#cfe8d8" text-anchor="middle">battery in</text><rect x="386" y="200" width="60" height="34" rx="5" fill="#2bb3a3"/><rect x="386" y="244" width="60" height="34" rx="5" fill="#2bb3a3"/><text x="416" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#cfe8d8" text-anchor="middle">motor out</text><rect x="250" y="316" width="60" height="26" rx="4" fill="#e8c33a"/><circle cx="262" cy="329" r="4" fill="#333"/><circle cx="280" cy="329" r="4" fill="#333"/><circle cx="298" cy="329" r="4" fill="#333"/><text x="280" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#cfe8d8" text-anchor="middle">signal (PWM)</text><line x1="114" y1="217" x2="500" y2="150" stroke="#5A6B75" stroke-width="1.3"/><text x="506" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#C0392B" text-anchor="start">Battery power in</text><text x="506" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B75" text-anchor="start">(from the tether)</text><line x1="446" y1="260" x2="500" y2="230" stroke="#5A6B75" stroke-width="1.3"/><text x="506" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2bb3a3" text-anchor="start">To the thruster</text><line x1="280" y1="342" x2="500" y2="320" stroke="#5A6B75" stroke-width="1.3"/><text x="506" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B7791F" text-anchor="start">PWM signal</text><text x="506" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B75" text-anchor="start">from the Raspberry Pi</text><text x="506" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B75" text-anchor="start">(~1500 µs = stop)</text>
