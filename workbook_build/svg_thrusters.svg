  <defs><marker id="ah-0E7C7B" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="#0E7C7B"/></marker><marker id="ah-2E8BA0" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="#2E8BA0"/></marker><marker id="ah-C0392B" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="#C0392B"/></marker></defs><text x="40" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">Three-thruster layout (top-down view)</text><text x="40" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6B75" text-anchor="start">Two horizontal thrusters drive and turn; one vertical thruster (center) controls depth.</text><rect x="205" y="180" width="250" height="180" rx="14" fill="none" stroke="#1F3A5F" stroke-width="6"/><line x1="330" y1="170" x2="330" y2="380" stroke="#5A6B75" stroke-width="1.5" stroke-dasharray="5 5"/><text x="400" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5A6B75" text-anchor="start">centerline</text><circle cx="239" cy="330" r="26" fill="#1F3A5F" stroke="#0E7C7B" stroke-width="3"/>
