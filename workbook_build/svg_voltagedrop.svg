<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <defs><marker id="ah-0E7C7B" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="#0E7C7B"/></marker><marker id="ah-C0392B" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="#C0392B"/></marker><marker id="ah-2E8BA0" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 Z" fill="#2E8BA0"/></marker></defs><text x="40" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">Voltage drop along the tether (V = I × R)</text><text x="40" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5A6B75" text-anchor="start">Current through the tether's resistance loses voltage before it reaches the motor — and heats the wire.</text><rect x="40" y="150" width="110" height="110" rx="10" fill="#1F3A5F" stroke="#0E7C7B" stroke-width="3"/><text x="95" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">BATTERY</text><text x="95" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5fd0c5" text-anchor="middle">12 V</text><line x1="150" y1="178" x2="660" y2="178" stroke="#0E7C7B" stroke-width="9"/><line x1="660" y1="232" x2="150" y2="232" stroke="#2E8BA0" stroke-width="9"/><text x="405" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B75" text-anchor="middle">tether out  (resistance R)</text><text x="405" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B75" text-anchor="middle">tether back  (resistance R)</text><path d="M210 150 q6 -10 12 0" stroke="#C0392B" stroke-width="2" fill="none" opacity="0.65"/><path d="M285 150 q6 -10 12 0" stroke="#C0392B" stroke-width="2" fill="none" opacity="0.65"/><path d="M360 150 q6 -10 12 0" stroke="#C0392B" stroke-width="2" fill="none" opacity="0.65"/><path d="M435 150 q6 -10 12 0" stroke="#C0392B" stroke-width="2" fill="none" opacity="0.65"/><path d="M510 150 q6 -10 12 0" stroke="#C0392B" stroke-width="2" fill="none" opacity="0.65"/><path d="M585 150 q6 -10 12 0" stroke="#C0392B" stroke-width="2" fill="none" opacity="0.65"/><text x="405" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#C0392B" text-anchor="middle">wire heats up</text><circle cx="730" cy="205" r="46" fill="#1F3A5F" stroke="#0E7C7B" stroke-width="3"/><rect x="726" y="175" width="8" height="60" rx="4" fill="#5fd0c5"/><rect x="700" y="201" width="60" height="8" rx="4" fill="#5fd0c5"/><text x="730" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#12222E" text-anchor="middle">motor</text><rect x="150" y="292" width="220" height="60" rx="8" fill="#CFE8EF"/><text x="160" y="315" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5A6B75" text-anchor="start">At the battery</text><text x="160" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0E7C7B" text-anchor="start">12.0 V</text><rect x="520" y="292" width="250" height="60" rx="8" fill="#CFE8EF"/><text x="530" y="315" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5A6B75" text-anchor="start">At the motor (after drop)</text><text x="530" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#C0392B" text-anchor="start">10.8 V</text><text x="405" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">→  lose I×R  →</text><text x="40" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#12222E" text-anchor="start">Example: 3 A through 0.2 Ω each way  →  3×0.2 + 3×0.2 = 1.2 V lost  →  12.0 − 1.2 = 10.8 V at the motor.</text>
  </svg>